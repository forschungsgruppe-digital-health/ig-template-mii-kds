# -----------------------------------------------------------------------------
# release-please — SemVer release automation for THIS TEMPLATE REPO
#
# Purpose:   Watches the Conventional Commits that land on `main` (via the
#            dev -> main release-candidate merge, see CONTRIBUTING.md) and
#            maintains a release PR. Merging that release PR cuts the SemVer
#            tag (vMAJOR.MINOR.PATCH), the GitHub Release, and the
#            auto-generated CHANGELOG.md.
# Trigger:   push to `main` (release automation runs on `main` only).
# Toggle:    vars.ENABLE_RELEASE_PLEASE — ON by default; set the repo variable
#            to 'false' to make the job skip without editing YAML.
# Human-gated steps:
#   - The dev -> main merge (release-candidate gate) is a human-reviewed PR.
#   - The Release Please release PR must be merged by a human; nothing is
#     tagged or released until then.
#   - Publication (registry/site) is NOT part of this workflow — it stays a
#     separate, manual, gated workflow_dispatch.
#
# Scope: Release Please versions the TEMPLATE REPO ITSELF (SemVer).
# MII KDS modules release via the MII Module Release Workflow (CalVer
# YYYY.n.n); these files on top of that would give a module a second,
# conflicting version stream, so the module template's first-run bootstrap
# removes them from a newly created module.
#
# Version sync (release-please-config.json `extra-files`): three files carry
# the version and are bumped by the STRUCTURED updaters, which address the
# value by JSONPath. No in-file marker comment is involved (JSON cannot carry
# one), so there is nothing to preserve when editing these files:
#   - package/package.json — json updater, $.version
#   - sushi-config.yaml    — yaml updater, $.version
#   - package-list.json    — json updater, $.list[0].version
# A version spelled out anywhere else is NOT bumped and will drift — keep it
# out of free text such as package-list.json `list[0].desc`.
# -----------------------------------------------------------------------------
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ vars.ENABLE_RELEASE_PLEASE != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  # Render the demo for the release this run just created.
  # WHY a call and not `on: release` in release-demo.yml: release-please publishes
  # the release with the default GITHUB_TOKEN, and GitHub suppresses workflow
  # triggers from events raised by that token, so a release trigger there never
  # fires — the demo would silently keep serving the previous release. Calling it
  # from inside this run sidesteps that, because no new event is involved.
  release-demo:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release-demo.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      update_landing_page: true
    permissions:
      contents: write
    secrets: inherit
