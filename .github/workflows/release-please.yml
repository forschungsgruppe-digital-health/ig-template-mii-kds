# -----------------------------------------------------------------------------
# release-please — SemVer release automation for THIS TEMPLATE REPO (spec §2.2)
#
# Purpose:   Watches the Conventional Commits that land on `main` (via the
#            dev -> main release-candidate merge, see CONTRIBUTING.md) and
#            maintains a release PR. Merging that release PR cuts the SemVer
#            tag (vMAJOR.MINOR.PATCH), the GitHub Release, and the
#            auto-generated CHANGELOG.md.
# Trigger:   push to `main` (release automation runs on `main` only, §2.6).
# Toggle:    vars.ENABLE_RELEASE_PLEASE — ON by default; set the repo variable
#            to 'false' to make the job skip without editing YAML (§2.13).
# Human-gated steps:
#   - The dev -> main merge (release-candidate gate) is a human-reviewed PR.
#   - The Release Please release PR must be merged by a human; nothing is
#     tagged or released until then.
#   - Publication (registry/site) is NOT part of this workflow — it stays a
#     separate, manual, gated workflow_dispatch (§2.2).
#
# Scope (§2.2): Release Please versions the TEMPLATE REPO ITSELF (SemVer).
# MII KDS modules release solely via the MII Module Release Workflow
# (CalVer YYYY.n.n); a module must NEVER carry these files — the module
# template's first-run bootstrap removes them from a newly created module.
#
# Version sync (release-please-config.json `extra-files`): three files carry
# the version and are bumped by the STRUCTURED updaters, which address the
# value by JSONPath. No in-file marker comment is involved (JSON cannot carry
# one), so there is nothing to preserve when editing these files:
#   - package/package.json — json updater, $.version
#   - sushi-config.yaml    — yaml updater, $.version
#   - package-list.json    — json updater, $.list[0].version
# A version spelled out anywhere else is NOT bumped and will drift — keep it
# out of free text such as package-list.json `list[0].desc`.
# -----------------------------------------------------------------------------
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ vars.ENABLE_RELEASE_PLEASE != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
