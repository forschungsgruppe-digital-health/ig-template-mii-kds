id: de.medizininformatikinitiative.template.preview
packageId: de.medizininformatikinitiative.template.preview
canonical: https://github.com/medizininformatik-initiative/ig-template-mii-kds
name: MIIKDSTemplatePreview
title: MII KDS IG Template — Preview
description: >-
  Minimal preview IG that builds the de.medizininformatikinitiative.template IG
  template standalone so its branding (header, footer, CSS, logo) is rendered
  and visually reviewable in English (default) and German. Not an MII KDS
  module.
status: draft
version: 1.0.1
releaseLabel: ci-build
fhirVersion: 4.0.1
license: CC0-1.0
copyrightYear: 2026+
# NUM-DIZ takes over IG development and maintenance when MII funding ends
# (end-2026), so NUM-DIZ is the publisher shown in the footer's
# "IG © <year> <publisher>" line (TF-KDS feedback 2026-08-14). "NUM-DIZ" is a
# proper name, hence language-neutral (docs/styleguide.md §6); the URL is the
# language-neutral site root. The module CONTENT stays MII content — artifact
# copyright labels are unaffected.
publisher:
  name: NUM-DIZ
  url: https://www.netzwerk-universitaetsmedizin.de
jurisdiction: urn:iso:std:iso:3166#DE "Germany"
parameters:
  i18n-default-lang: en
  i18n-lang:
    - de
  translation-sources:
    - input/translations/de
pages:
  index.md:
    title: Home
  translationinfo.md:
    title: Translation information
