# sushi-config.yaml — preview IG for the de.medizininformatikinitiative.template
# IG template.
# ============================================================================
# This is NOT an MII Core Dataset module. It is the smallest possible IG that
# the IG Publisher can render, and it exists ONLY so a `sushi . && publisher`
# run produces real pages that exercise this template's branding overrides
# (header, footer, CSS, logo) — see ig.ini and includes/.
#
# It is referenced by ig.ini (template = #.) and is never published to a
# package registry; the package id below is intentionally distinct from any
# KDS module id and ends in `.preview`.
#
# Multi-language is kept MINIMAL on purpose: German is the default language and
# English is the one additional language, so the language-aware header/footer
# render in BOTH languages. The full de→en translation workflow (translation
# sources, harvesting) is added by the multi-language task, not here.

id: de.medizininformatikinitiative.template.preview
packageId: de.medizininformatikinitiative.template.preview
canonical: https://github.com/medizininformatik-initiative/ig-template-mii-kds
name: MIIKDSTemplatePreview
title: "MII KDS IG Template — Preview"
description: "Minimal preview IG that builds the de.medizininformatikinitiative.template IG template standalone so its branding (header, footer, CSS, logo) is rendered and visually reviewable in German (default) and English. Not an MII KDS module."
status: draft
version: 0.2.0
releaseLabel: ci-build
fhirVersion: 4.0.1
license: CC0-1.0
copyrightYear: 2026+
publisher:
  # The template (and this preview of it) is an MII artifact; ownership stays
  # with the Medizininformatik-Initiative. Matches the module template's
  # publisher so every MII KDS IG shows the same responsible organisation.
  name: Medical Informatics Initiative (MII)
  url: https://www.medizininformatik-initiative.de/en
jurisdiction: urn:iso:std:iso:3166#DE "Germany"

# Multi-language: German default, English recommended (§3.4). German is the
# authoritative language; English is the recommended additional rendering.
#   i18n-default-lang: en       -> English is the leading/default rendered language
#   i18n-lang: [de]             -> German is the additional rendered language
#   translation-sources: [...]  -> folder(s) holding the per-language translations
# Two translation mechanisms live under a translation-source folder
# (mirroring FHIR/multi-lang-test-ig, the HL7 reference IG):
#   - NARRATIVE PAGES: input/translations/<lang>/pagecontent/<same-filename>
#     (e.g. input/translations/en/pagecontent/index.md) — the whole page is
#     rendered in that language on /<lang>/.
#   - CONFORMANCE RESOURCES: input/translations/<lang>/<ResourceType>-<id>.po
#     (msgid/msgstr entries translate resource fields such as description).
# The preview ships the English home page (input/translations/en/pagecontent/
# index.md) so /en/ renders in English — the mechanism a module maintainer
# follows (docs/recipes/add-translation.md). The preview carries no conformance
# resources; a module adds its own FSH + the matching .po files.
parameters:
  i18n-default-lang: en
  i18n-lang:
    - de
  translation-sources:
    - input/translations/de

# One home page (English default, German translation) + the auto-generated artifact index.
pages:
  index.md:
    title: "Home"

# NOTE: no `menu:` property here — the menu is maintained as
# input/includes/menu.xml (German, the default language) plus a per-language
# translation at input/translations/en/includes/menu.xml. That is the ONLY way to
# get a TRANSLATED menu (the `menu:` property generates one untranslatable
# menu.xml); it mirrors the HL7 reference IG FHIR/multi-lang-test-ig.

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  SUSHI configuration reference — every remaining option, commented          ║
# ║  ------------------------------------------------------------------------  ║
# ║  Copied from the SUSHI 3.20.0 default `sushi-config.yaml` (the version this  ║
# ║  repo pins) so you can see EVERY available option and what it means without  ║
# ║  external research. The options that this IG actually uses are set, active,  ║
# ║  ABOVE. The blocks below are the options this IG does NOT use — left         ║
# ║  commented as a reference. Full docs: https://fshschool.org/docs/sushi/configuration/ ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# ── title / description ──────────────────────────────────────────────────────
# Both are set above. `title` is the human-readable IG title; `description` is a
# short summary. (Shown here only to note they belong to the commonly-used set.)
#
# ── contact ──────────────────────────────────────────────────────────────────
# Those who need more control than the `publisher` block (above) can list
# contacts directly, following ImplementationGuide.contact / ContactDetail:
#
# contact:
#   - name: Bob Smith
#     telecom:
#       - system: email # phone | fax | email | pager | url | sms | other
#         value: bobsmith@example.org
#         use: work
#
# ── global ───────────────────────────────────────────────────────────────────
# IG.global — bind a profile to ALL instances of a resource type. The type is
# the YAML key; the value is a profile URL (or an array of URLs). An id or name
# is replaced with the correct canonical when the IG JSON is generated.
#
# global:
#   Patient: http://example.org/fhir/StructureDefinition/my-patient-profile
#   Encounter: http://example.org/fhir/StructureDefinition/my-encounter-profile
#
# ── resources ────────────────────────────────────────────────────────────────
# IG.definition.resource — SUSHI auto-generates these from your FSH and any
# JSON/XML resource files. Add entries only to override or complete the
# generated list. Use the reference as the YAML key; use "omit" to drop a
# FSH-generated resource from the IG.
#
# resources:
#   Patient/my-example-patient:
#     name: My Example Patient
#     description: An example Patient
#     exampleBoolean: true
#   Patient/bad-example: omit
#
# ── groups ───────────────────────────────────────────────────────────────────
# IG.definition.grouping — organize artifacts into groups on the IG's artifact
# pages. The IG docs recommend using the template's default groups instead; use
# this only if you want custom groups.
#
# groups:
#   GroupA:
#     name: Group A
#     description: The Alpha Group
#     resources:
#       - StructureDefinition/animal-patient
#       - StructureDefinition/arm-procedure
#
# ── other ImplementationGuide properties ─────────────────────────────────────
# These can be set as-is, following the ImplementationGuide resource format:
#   date · meta · implicitRules · language · text · contained · extension ·
#   modifierExtension · experimental · useContext · copyright · packageId
# (This IG sets several of them above, e.g. meta.profile for CRMI and a set of
#  artifact-* extensions.)
#
# ── SUSHI processing flags ───────────────────────────────────────────────────
# FSHOnly: when true, SUSHI exports ONLY the FSH-derived resources and generates
# no IG content (no ImplementationGuide, no page scaffolding). Default: false.
#
# FSHOnly: false
#
# applyExtensionMetadataToRoot: when true, an Extension's root element `short`
# and `definition` are set from the Extension's Title and Description.
# Default: true.
#
# applyExtensionMetadataToRoot: true
#
# instanceOptions — how SUSHI processes Instances. `manualSliceOrdering` is set
# above (recommended for new projects). The other options:
#   setMetaProfile: for which Instances SUSHI auto-sets meta.profile when
#                   InstanceOf references a profile.
#                   Values: always | never | inline-only | standalone-only
#   setId:          for which Instances SUSHI auto-sets id.
#                   Values: always | standalone-only
#
# instanceOptions:
#   setMetaProfile: always
#   setId: always
