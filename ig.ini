[IG]
; Self-test harness: build THIS template standalone so branding changes
; (header, footer, CSS, logo) are visually reviewable before a release.
;
; ig     = the ImplementationGuide resource SUSHI generates from sushi-config.yaml
;          (regenerated on every `sushi .` run into fsh-generated/).
; template = #.  -> use the repository root itself as the (contained) template.
;          The IG Publisher's "#<folder>" form loads <root> as a local template
;          package (it finds package/package.json with type fhir.template,
;          plus includes/ and content/) and excludes the build output/ and .git.
;          It is deliberately a LOCAL reference, never the base template's
;          #current: the self-test must build exactly the branding in this
;          working tree, and the base is pinned to fhir2.base.template#0.1.0 via
;          package/package.json (surfaced for bumps by the dependency checker).
ig = fsh-generated/resources/ImplementationGuide-de.medizininformatikinitiative.template.selftest.json
template = #.
