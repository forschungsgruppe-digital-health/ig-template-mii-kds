[IG]
; Preview harness: build THIS template standalone so branding changes
; (header, footer, CSS, logo) are visually reviewable before a release.
;
; ig     = the ImplementationGuide resource SUSHI generates from sushi-config.yaml
;          (regenerated on every `sushi .` run into fsh-generated/).
; template = #.  -> use the repository root itself as the (contained) template.
;          The IG Publisher's "#<folder>" form loads <root> as a local template
;          package (it finds package/package.json with type fhir.template,
;          plus includes/ and content/) and excludes the build output/ and .git.
;          It is deliberately a LOCAL reference, never the base template's
;          #current: the preview must build exactly the branding in this
;          working tree, and the base is pinned to fhir2.base.template#0.1.0 via
;          package/package.json (surfaced for bumps by the dependency checker).
ig = fsh-generated/resources/ImplementationGuide-de.medizininformatikinitiative.template.preview.json
template = #.

; ═══════════════════════════════════════════════════════════════════════════
;  ig.ini reference — every option the IG Publisher reads from this file
;  (copied so you can see the full surface without external research). ig.ini
;  is intentionally tiny: it has only TWO keys, `ig` and `template`. Everything
;  else about the IG is configured in the ImplementationGuide resource, which
;  SUSHI generates from sushi-config.yaml (see the `parameters:` block there).
;  Full docs: https://build.fhir.org/ig/FHIR/ig-guidance/  and
;  https://confluence.hl7.org/display/FHIR/Implementation+Guide+Parameters
; ───────────────────────────────────────────────────────────────────────────
;
;  ig = <path to the ImplementationGuide resource file>
;    Points at the IG resource the Publisher builds. With SUSHI this is the
;    generated file under fsh-generated/resources/ (as above).
;
;  template = <the IG template to apply>
;    The Publisher applies exactly ONE template. Accepted forms:
;      • Local template FOLDER — prefix a relative path with `#`:
;          template = #.                  (this repo root IS the template — the
;                                          preview form: package/package.json is
;                                          type fhir.template, plus includes/ and
;                                          content/)
;          template = #ig-template        (a subfolder used as the template)
;      • Published package (id#version) — how a consuming module references THIS
;        template once it is released:
;          template = de.medizininformatikinitiative.template#0.1.0
;      • Floating to newest (NOT allowed here — §0.2 pins every version; shown
;        only for completeness):
;          template = de.medizininformatikinitiative.template#current
;      • Base HL7 templates (this template derives from fhir2.base.template as
;        its BASE via package/package.json — not referenced directly here):
;          template = fhir.base.template   (avoided by MII — reported issues)
;          template = hl7.fhir.template    (adds HL7 logos — not for MII)
;    If no #version is given for a package, the Publisher takes #current.
;
;  Other keys occasionally seen in ig.ini (rarely needed; documented for
;  completeness — leave unset unless you have a specific reason):
;    fhir-settings-file = <path>   ; a fhir-settings.json (e.g. tx server auth)
;    force               = true    ; keep a running publisher, skip some checks
;
;  NB: template-parameters such as copyrightyear, excludexml, releaselabel, etc.
;  are NOT ig.ini keys — set them under `parameters:` in sushi-config.yaml. The
;  full list this template accepts is in its config.json ("template-parameters"),
;  inherited from fhir2.base.template: copyrightyear, excludelogbinaryformat,
;  excludejson, excludemap, excludettl, excludexml, fmm-definition,
;  globals-in-artifacts, releaselabel, requirements-category-vs, shownav,
;  term-params-in-artifacts, toggle-changes.
; ═══════════════════════════════════════════════════════════════════════════
