[IG]
; Preview harness: build THIS template standalone so branding changes
; (header, footer, CSS, logo) are visually reviewable before a release.
;
; ig.ini has exactly two keys. Everything else about the IG is configured in
; the ImplementationGuide resource, which SUSHI generates from
; sushi-config.yaml (see its `parameters:` block). Full reference:
; https://build.fhir.org/ig/FHIR/ig-guidance/ and
; https://confluence.hl7.org/display/FHIR/Implementation+Guide+Parameters
;
; ig       = the ImplementationGuide resource, regenerated into fsh-generated/
;            on every `sushi .` run.
; template = the ONE template the Publisher applies. A leading `#` makes it a
;            local FOLDER, no `#` makes it a package id. `#.` means "this
;            repository root IS the template" (package/package.json is type
;            fhir.template, plus includes/ and content/), so the preview
;            renders exactly the branding in this working tree. A consuming
;            module instead uses `#ig-template` (a vendored copy) or
;            `de.medizininformatikinitiative.template#<version>` — never a
;            floating `#current`, because every version here is pinned.
ig = fsh-generated/resources/ImplementationGuide-de.medizininformatikinitiative.template.preview.json
template = #.
