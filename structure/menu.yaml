# Canonical MII KDS module IG menu — the authoritative navigation every module
# built from mii-kds-module-template mirrors. This is the SINGLE SOURCE OF TRUTH
# for the module page structure (Option B: menu/structure owned by the IG
# template). A module copies this into its sushi-config.yaml `menu:` property
# (or input/includes/menu.xml) and keeps it in sync — see the module template's
# docs/recipes/sync-structure.md.
#
# The IG Publisher cannot inject a menu from a template (menu is read only from
# the module's own input/includes/menu.xml or the sushi `menu:` property), so
# "ownership" here means: this file is authoritative; modules mirror it.
